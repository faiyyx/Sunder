<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c2c"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e0a020"/>
    </linearGradient>
  </defs>
  <rect id="frame" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- target line -->
  <line x1="128" y1="136" x2="384" y2="136" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="22 20"/>
  <!-- stop line -->
  <line x1="128" y1="392" x2="384" y2="392" stroke="#ef4444" stroke-width="14" stroke-linecap="round" stroke-dasharray="22 20"/>
  <!-- candle wick -->
  <line x1="256" y1="168" x2="256" y2="360" stroke="#e9b93c" stroke-width="16" stroke-linecap="round"/>
  <!-- candle body -->
  <rect x="204" y="206" width="104" height="120" rx="18" fill="url(#gold)"/>
  <!-- split notch -->
  <line x1="204" y1="266" x2="308" y2="266" stroke="#0b0f19" stroke-width="10"/>
</svg>
